[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litfem"
version = "0.1.0"
description = "Analisis literario PTM-V con LLM (salidas estructuradas)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "pydantic>=2",
    "pandas",
    "openpyxl",
    "python-dotenv",
]

[tool.setuptools]
packages = ["litfem"]
